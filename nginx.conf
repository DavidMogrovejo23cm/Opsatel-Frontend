server {
  listen 80;
  server_name _;
  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  # Documentación interactiva de FastAPI
  location ~ ^/(docs|redoc|openapi\.json) {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos estáticos servidos por backend (adjuntos, reportes, cédulas)
  location ~ ^/(uploads|rutas_reportes)/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Endpoints de API del backend
  location ~ ^/(auth|clientes|extras|configuraciones|backup|hoja-ruta|whatsapp|balance|callcenter|tickets|asistencia|olt-tasks|libreqos|caja|peliculas|discovery|sync|workflows|bulk-activation|health|metrics)(/|$) {
    # Si la petición viene del navegador solicitando una página web (F5 / recarga directa con Accept: text/html), servir la SPA
    if ($http_accept ~* "text/html") {
      rewrite ^ /index.html break;
    }

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Rutas de la SPA (React Router) y archivos estáticos del frontend
  location / {
    try_files $uri $uri/ /index.html;
  }
}

