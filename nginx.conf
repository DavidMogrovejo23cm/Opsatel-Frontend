server {
  listen 80;
  server_name _;
  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(auth|clientes|extras|configuraciones|backup|rutas_reportes|uploads|hoja-ruta|whatsapp|balance|callcenter|tickets|asistencia|olt-tasks|libreqos|caja|peliculas|discovery|sync|workflows|bulk-activation|health|metrics|docs|openapi.json) {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
