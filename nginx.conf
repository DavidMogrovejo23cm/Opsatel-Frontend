server {
  listen 80;
  server_name _;
  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  # Rutas directas de la SPA (evitan ser interceptadas por el proxy del backend)
  location = /whatsapp {
    try_files /index.html =404;
  }
  location = /tickets {
    try_files /index.html =404;
  }
  location = /balance {
    try_files /index.html =404;
  }
  location = /callcenter {
    try_files /index.html =404;
  }
  location = /asistencia {
    try_files /index.html =404;
  }
  location = /hoja-ruta {
    try_files /index.html =404;
  }

  location ~ ^/(auth|clientes|extras|configuraciones|rutas_reportes|uploads|hoja-ruta|whatsapp|balance|callcenter|tickets|asistencia|olt-tasks|libreqos) {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
